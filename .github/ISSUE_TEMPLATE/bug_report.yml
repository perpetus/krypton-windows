name: Bug report
description: Tell us what went wrong while using Krypton.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Krypton version
      placeholder: 0.20.1.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: You can find this in Settings → System → About.
      placeholder: Windows 11, version and build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps to reproduce it, what you expected, and what happened instead. Remove private information from screenshots or logs.
    validations:
      required: true
